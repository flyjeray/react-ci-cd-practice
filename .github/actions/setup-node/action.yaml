name: "Setup Node.js with npm cache"
description: "Setup Node.js, restore npm cache, install dependencies"

inputs:
  node-version:
    description: "Node.js version"
    required: true

outputs:
  cache-summary:
    description: "Summary of npm cache hits and misses"
    value: ${{ steps.summary.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore npm cache
      id: cache-npm
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install dependencies
      shell: bash
      run: |
        echo "Installing dependencies..."
        npm ci --prefer-offline --verbose > npm-install.log

    - name: Generate cache summary
      id: summary
      shell: bash
      run: |
        SUMMARY=$(cat <<EOF
        Cache summary:
        Hit: $(grep -c '(cache hit)' npm-install.log || true)
        Miss: $(grep -c '(cache miss)' npm-install.log || true)
        Revalidate: $(grep -c '(cache revalidated)' npm-install.log || true)
        Update: $(grep -c '(cache updated)' npm-install.log || true)
        Stale: $(grep -c '(cache stale)' npm-install.log || true)
        EOF
        )
        echo "$SUMMARY"
        echo "summary<<EOF" >> $GITHUB_OUTPUT
        echo "$SUMMARY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

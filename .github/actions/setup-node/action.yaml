name: "Setup Node.js with npm cache"
description: "Setup Node.js, restore npm cache, install dependencies"

inputs:
  node-version:
    description: "Node.js version"
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore npm cache
      id: cache-npm
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install dependencies
      shell: bash
      run: |
        echo "Installing dependencies..."
        npm ci --prefer-offline --quiet | tee npm-install.log
        echo ""
        echo "Cache summary:"
        echo "From cache: $(grep -c '(from cache)' npm-install.log || true)"
        echo "Revalidated: $(grep -c '(cache revalidated)' npm-install.log || true)"
        echo "Stale cache: $(grep -c '(cache stale)' npm-install.log || true)"

name: "Setup Node.js with npm cache"
description: "Setup Node.js, restore npm cache, install dependencies"

inputs:
  node-version:
    description: "Node.js version"
    required: true

outputs:
  cache-summary:
    description: "Summary of npm cache hits and misses"
    value: ${{ steps.summary.outputs.summary }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}

    - name: Restore npm cache
      id: cache-npm
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-

    - name: Install dependencies
      shell: bash
      run: |
        echo "Installing dependencies..."
        npm ci --prefer-offline --quiet

    - name: Generate cache summary
      id: summary
      shell: bash
      run: |
        # The timing data is in the last file in the logs directory
        TIMING_FILE=$(ls -t ~/.npm/_logs/*.log | head -n 1)
        if [ -f "$TIMING_FILE" ]; then
          HITS=$(jq -r 'select(.name == "npm:load:package:content") | .["cache-hit"]' "$TIMING_FILE" | grep -c true || true)
          MISSES=$(jq -r 'select(.name == "npm:load:package:content") | .["cache-hit"]' "$TIMING_FILE" | grep -c false || true)
          SUMMARY=$(cat <<EOF
          Cache summary (from timing logs):
          Package Hits: $HITS
          Package Misses: $MISSES
        EOF
          )
        else
          SUMMARY="Cache summary: No timing log file found."
        fi
        echo "$SUMMARY"
        echo "summary<<EOF" >> $GITHUB_OUTPUT
        echo "$SUMMARY" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node
        with:
          node-version: 18

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

  notify:
    name: Notify on Slack
    needs: [build-and-deploy]
    if: always()
    uses: ./.github/workflows/reusable-slack-notify.yml
    with:
      status: ${{ (contains(needs.*.result, 'failure') && 'failure') || 'success' }}
      title: "Deploy ${{ (contains(needs.*.result, 'failure') && 'Failed') || 'Successful' }}"
      message: "The Deploy workflow finished.. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here to view the run.>"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

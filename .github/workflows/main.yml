name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node
        with:
          node-version: 18

      - name: Build React app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: ./build

  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node
        with:
          node-version: 18

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./build

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run style-check

  types:
    name: Type checking
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node
        with:
          node-version: 18

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./build

      - name: Run TypeScript type checking
        run: npm run typecheck

  jest:
    name: Run Jest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node
        with:
          node-version: 18

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./build

      - name: Run Jest tests
        run: npm test

  notify-slack-on-success:
    name: Notify on success
    runs-on: ubuntu-latest
    needs: [lint, types, jest]
    if: success()
    steps:
      - name: Send Slack notification on success
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: "GitHub Actions"
          SLACK_ICON_EMOJI: ":github:"
          SLACK_COLOR: "good"
          SLACK_TITLE: "PR Checks Passed"
          SLACK_MESSAGE: "All PR checks passed for PR #${{ github.event.pull_request.number }}. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here to view the run.>"

  notify-slack-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [lint, types, jest]
    if: failure()
    steps:
      - name: Send Slack notification on failure
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_USERNAME: "GitHub Actions"
          SLACK_ICON_EMOJI: ":github:"
          SLACK_COLOR: "danger"
          SLACK_TITLE: "PR Checks Failed"
          SLACK_MESSAGE: "The PR Checks workflow failed for PR #${{ github.event.pull_request.number }}. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here to view the run.>"

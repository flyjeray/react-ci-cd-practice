name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node
        with:
          node-version: 18

      - name: Build React app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: ./build

  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node
        with:
          node-version: 18

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./build

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run style-check

  types:
    name: Type checking
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node
        with:
          node-version: 18

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./build

      - name: Run TypeScript type checking
        run: npm run typecheck

  jest:
    name: Run Jest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - uses: ./.github/actions/setup-node
        with:
          node-version: 18

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./build

      - name: Run Jest tests
        run: npm test

  notify:
    name: Notify on Slack
    needs: [lint, types, jest]
    if: always() # This job runs regardless of the outcome of the dependent jobs
    uses: ./.github/workflows/reusable-slack-notify.yml
    with:
      status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
      title: "Pull Request Checks ${{ (contains(needs.*.result, 'failure') && 'Failed' || 'Passed' }}"
      message: "Pull Request Checks workflow finished for PR #${{ github.event.pull_request.number }}. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here to view the run.>"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

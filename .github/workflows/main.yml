name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build React App
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node environment
        uses: ./.github/workflows/reusable/node-setup.yml
        with:
          node-version: 18

      - name: Build React app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: ./build

  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Node environment
        uses: ./.github/workflows/reusable/node-setup.yml
        with:
          node-version: 18

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./build

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run style-check

  types:
    name: Type checking
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Node environment
        uses: ./.github/workflows/reusable/node-setup.yml
        with:
          node-version: 18

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./build

      - name: Run TypeScript type checking
        run: npm run typecheck

  jest:
    name: Run Jest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Node environment
        uses: ./.github/workflows/reusable/node-setup.yml
        with:
          node-version: 18

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: react-build
          path: ./build

      - name: Run Jest tests
        run: npm test

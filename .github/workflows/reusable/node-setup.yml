name: "Setup Node and Install Dependencies"

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

jobs:
  install-dependencies:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-node-modules.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}

      - name: Restore npm cache
        id: cache-node-modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        id: npm-install
        run: |
          echo "Starting npm ci..."
          npm ci --prefer-offline --quiet | tee npm-install.log
          echo ""
          echo "Cache effectiveness summary:"
          grep -c "(from cache)" npm-install.log | xargs -I{} echo "Packages fully from cache: {}"
          grep -c "(cache revalidated)" npm-install.log | xargs -I{} echo "Packages revalidated from registry: {}"
          grep -c "(cache stale)" npm-install.log | xargs -I{} echo "Packages with stale cache: {}"
